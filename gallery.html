        /* Hero Section */
        .page-hero { padding: 140px 5% 40px; text-align: center; }
        .page-hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 3.5rem); text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .page-hero h1 span { color: var(--neon-gold); }

        /* Tabs */
        .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 0 5% 40px; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3); color: #ddd; padding: 10px 24px; border-radius: 50px; cursor: pointer; font-size: 0.95rem; transition: var(--transition); font-family: 'Poppins', sans-serif; font-weight: 500; }

        /* Gallery Grid */
        .gallery-section { max-width: 1300px; margin: 0 auto 60px; padding: 0 5%; animation: fadeIn 0.5s ease-in-out; }
        .gallery-section h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 30px; border-left: 5px solid var(--neon-gold); padding-left: 15px; color: #fff; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; height: 220px; border: 1px solid rgba(212,175,55,0.15); background: #111; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: block; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease, filter 0.3s ease; filter: brightness(0.85); }
        .gallery-item:hover img { transform: scale(1.1); filter: brightness(1.1); }
        .gallery-item:hover { border-color: var(--neon-gold); box-shadow: 0 8px 25px rgba(212,175,55,0.25); z-index: 2; }

    <script>
        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('active'); 
        }

        const tabBtns = document.querySelectorAll('.tab-btn');
        // Updated JS sections mapping - added 'awards'
        const sections = { 
            infra: document.getElementById('infra'), 
            events: document.getElementById('events'), 
            sports: document.getElementById('sports'), 
            teachers: document.getElementById('teachers'), 
            awards: document.getElementById('awards'), // Yahan awards add kiya hai
            moments: document.getElementById('moments') 
        };
        
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all buttons
                tabBtns.forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                btn.classList.add('active');
                
                // Hide all sections
                Object.keys(sections).forEach(key => { 
                    if(sections[key]) sections[key].style.display = 'none'; 
                });
                
                // Show targeted section
                const targetId = btn.dataset.target;
                if(sections[targetId]) {
                    sections[targetId].style.display = 'block';
                }
            });
        });
    </script>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJPS | Jarvis AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050508;
    color: white;
    font-family: Poppins, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
}

/* HEADER */

nav {
    height: 100px;
    flex-shrink: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 5%;

    background: #050508;
    border-bottom: 1px solid rgba(212,175,55,.3);
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 800;
}

.logo span {
    display: block;
    color: #D4AF37;
    font-size: .6rem;
    letter-spacing: 3px;
}

.back-btn {
    color: #D4AF37;
    text-decoration: none;
    border: 1px solid #D4AF37;
    padding: 9px 16px;
    border-radius: 25px;
}

/* JARVIS CONTAINER */

.jarvis-container {
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: hidden;
    background: #050508;
}

#jarvisFrame {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    background: #050508;
}

/* MOBILE */

@media(max-width:500px) {
    nav {
        height: 85px;
        padding: 12px 5%;
    }

    .logo {
        font-size: 1.3rem;
    }

    .back-btn {
        padding: 8px 12px;
        font-size: .85rem;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<nav>

    <div class="logo">
        DJPS
        <span>JARVIS AI ASSISTANT</span>
    </div>

    <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Home
    </a>

</nav>

<!-- YOUR JARVIS AI -->

<div class="jarvis-container">

    <iframe
        id="jarvisFrame"
        src="https://jarvis.ashutoshsingh.online"
        title="DJPS Jarvis AI Assistant"
        allow="microphone; camera"
        allowfullscreen
        loading="eager">
    </iframe>

</div>

</body>
</html>

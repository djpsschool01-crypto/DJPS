<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DJPS AI Assistant</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050508;
            color: #fff;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(5, 5, 8, 0.98);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            flex-shrink: 0;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .logo span {
            color: #D4AF37;
            font-size: 0.6rem;
            display: block;
            letter-spacing: 3px;
        }

        .back-btn {
            color: #D4AF37;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid #D4AF37;
            padding: 8px 15px;
            border-radius: 20px;
        }

        /* CHAT */
        .chat-container {
            flex: 1;
            padding: 20px 5%;
            overflow-y: auto;
            overflow-x: hidden;

            display: flex;
            flex-direction: column;
            gap: 15px;

            width: 100%;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bot-msg {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-msg {
            background: linear-gradient(135deg, #D4AF37, #b59223);
            color: #000;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* LOADER */
        .loader {
            display: none;
            font-size: 0.9rem;
            color: #D4AF37;
            align-self: flex-start;
            margin: 0 5% 8px;
        }

        /* INPUT */
        .input-area {
            flex-shrink: 0;

            padding: 15px 5%;
            padding-bottom: calc(
                15px + env(safe-area-inset-bottom, 10px)
            );

            background: #0a0a0f;
            border-top: 1px solid rgba(212, 175, 55, 0.2);

            display: flex;
            justify-content: center;

            width: 100%;
        }

        .input-box {
            max-width: 800px;
            width: 100%;

            display: flex;
            gap: 12px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;

            padding: 15px 20px;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;

            color: #fff;
            outline: none;

            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input[type="text"]:focus {
            border-color: #D4AF37;
            background: rgba(255, 255, 255, 0.1);
        }

        /* SEND BUTTON */
        .send-btn {
            width: 50px;
            height: 50px;
            min-width: 50px;

            border: none;
            border-radius: 50%;

            background: #D4AF37;
            color: #000;

            font-size: 1.2rem;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.08);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 500px) {
            .message {
                max-width: 90%;
                font-size: 0.9rem;
            }

            .back-btn {
                padding: 7px 12px;
                font-size: 0.8rem;
            }

            .logo {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <nav>
        <div class="logo">
            DJPS
            <span>AI Assistant</span>
        </div>

        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Home
        </a>
    </nav>


    <!-- CHAT -->
    <div class="chat-container" id="chatBox">

        <div class="message bot-msg">
            Hello! Main DJPS ka smart AI assistant hoon.
            Aap mujhse koi bhi sawal pooch sakte hain, ya Admission page par jaane ke liye keh sakte hain!
        </div>

    </div>


    <!-- LOADER -->
    <div class="loader" id="typingLoader">
        <i class="fas fa-circle-notch fa-spin"></i>
        DJPS AI is thinking...
    </div>


    <!-- INPUT -->
    <div class="input-area">

        <div class="input-box">

            <input
                type="text"
                id="userInput"
                placeholder="Ask anything or type 'Admission'..."
                autocomplete="off"
            >

            <button
                type="button"
                class="send-btn"
                id="sendBtn"
                aria-label="Send message"
            >
                <i class="fas fa-paper-plane"></i>
            </button>

        </div>

    </div>


    <script>

        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const loader = document.getElementById("typingLoader");


        /* ================================
           SEND BUTTON
        ================================= */

        sendBtn.addEventListener("click", sendMessage);


        /* ================================
           ENTER KEY
        ================================= */

        userInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter" && !event.shiftKey) {

                event.preventDefault();

                sendMessage();
            }

        });


        /* ================================
           SEND MESSAGE
        ================================= */

        async function sendMessage() {

            const text = userInput.value.trim();

            if (!text) {
                return;
            }


            // Add user message
            addMessage(text, "user-msg");

            // Clear input
            userInput.value = "";

            // Disable button while AI responds
            sendBtn.disabled = true;


            /* ================================
               ADMISSION REDIRECT
            ================================= */

            const lowerText = text.toLowerCase();

            if (
                lowerText.includes("admission") ||
                lowerText.includes("admission page") ||
                lowerText.includes("admission form")
            ) {

                setTimeout(() => {

                    addMessage(
                        "Redirecting you to the Admission page...",
                        "bot-msg"
                    );

                    setTimeout(() => {

                        window.location.href = "admission.html";

                    }, 1000);

                }, 400);

                sendBtn.disabled = false;

                return;
            }


            /* ================================
               SHOW LOADER
            ================================= */

            loader.style.display = "block";

            scrollToBottom();


            try {

                /*
                 * IMPORTANT:
                 * API KEY frontend me mat rakho.
                 *
                 * Backend endpoint:
                 * POST /api/chat
                 *
                 * Backend Groq API ko securely call karega.
                 */

                const response = await fetch("/api/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "API request failed"
                    );

                }


                /* ================================
                   AI RESPONSE
                ================================= */

                const reply =
                    data.reply ||
                    data.message ||
                    data.choices?.[0]?.message?.content;


                if (reply) {

                    addMessage(
                        reply,
                        "bot-msg"
                    );

                } else {

                    addMessage(
                        "Sorry, AI ne koi response nahi diya.",
                        "bot-msg"
                    );

                    console.log("API Response:", data);
                }


            } catch (error) {

                console.error("AI Error:", error);

                addMessage(
                    "Sorry! AI se connection nahi ho paaya. Please try again.",
                    "bot-msg"
                );

            } finally {

                loader.style.display = "none";

                sendBtn.disabled = false;

                userInput.focus();

                scrollToBottom();
            }

        }


        /* ================================
           ADD MESSAGE
        ================================= */

        function addMessage(text, className) {

            const msgDiv =
                document.createElement("div");

            msgDiv.className =
                `message ${className}`;

            msgDiv.textContent = text;

            chatBox.appendChild(msgDiv);

            scrollToBottom();
        }


        /* ================================
           SCROLL
        ================================= */

        function scrollToBottom() {

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }


        /* ================================
           INITIAL FOCUS
        ================================= */

        userInput.focus();

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJPS AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
       <style>
        /* ================= MOBILE LAYOUT FIX ================= */
        html, body { 
            height: 100%; 
            height: -webkit-fill-available; /* Mobile gesture bar ke peeche nahi jayega */
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* Poori screen hilne se ruk jayegi, sirf chat scroll hogi */
            background: #050508; 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
        }
        
        body {
            display: flex; 
            flex-direction: column; 
        }
        
        /* Header */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 5%; 
            background: rgba(5,5,8,0.98); 
            border-bottom: 1px solid rgba(212,175,55,0.3); 
            flex-shrink: 0; /* Header kabhi chhota nahi hoga */
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 800; } 
        .logo span { color: #D4AF37; font-size: 0.6rem; display: block; letter-spacing: 3px; }
        .back-btn { color: #D4AF37; text-decoration: none; font-size: 0.9rem; border: 1px solid #D4AF37; padding: 8px 15px; border-radius: 20px; }
        
        /* Chat Area */
        .chat-container { 
            flex: 1; 
            padding: 20px 5%; 
            overflow-y: auto; 
            overflow-x: hidden;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            width: 100%; 
            box-sizing: border-box;
        }
        
        .message { 
            max-width: 85%; 
            padding: 12px 18px; 
            border-radius: 15px; 
            font-size: 0.95rem; 
            line-height: 1.5; 
            animation: fadeIn 0.3s ease; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .bot-msg { background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3); color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background: linear-gradient(135deg, #D4AF37, #b59223); color: #000; font-weight: 500; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        /* Input Area - BOTTOM LOCKED */
        .input-area { 
            flex-shrink: 0; /* Dabba kabhi bottom se katega nahi */
            padding: 15px 5%; 
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 10px)); /* Swipe line se thoda upar rakhega */
            background: #0a0a0f; 
            border-top: 1px solid rgba(212,175,55,0.2); 
            display: flex; 
            justify-content: center; 
            width: 100%;
            box-sizing: border-box;
        }
        .input-box { 
            max-width: 800px; 
            width: 100%; 
            display: flex; 
            gap: 12px; 
            align-items: center;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 15px 20px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(212,175,55,0.4); 
            border-radius: 30px; 
            color: #fff; 
            outline: none; 
            font-family: 'Poppins', sans-serif; 
            font-size: 1rem; 
            box-sizing: border-box;
        }
        input[type="text"]:focus { 
            border-color: #D4AF37; 
            background: rgba(255,255,255,0.1);
        }
        .send-btn { 
            width: 50px; 
            height: 50px; 
            min-width: 50px; 
            border: none; 
            border-radius: 50%; 
            background: #D4AF37; 
            color: #000; 
            font-size: 1.2rem; 
            cursor: pointer; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .send-btn:hover { transform: scale(1.1); }
        
        .loader { display: none; font-size: 0.9rem; color: #D4AF37; align-self: flex-start; margin-left: 10px; }
       </style>
    
</head>
<body>

    <nav>
        <div class="logo">DJPS <span>AI Assistant</span></div>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
    </nav>

    <div class="chat-container" id="chatBox">
        <div class="message bot-msg">
            Hello! Main DJPS ka smart AI assistant hoon. Aap mujhse koi bhi sawal pooch sakte hain, ya Admission page par jaane ke liye keh sakte hain!
        </div>
    </div>
    
    <div class="loader" id="typingLoader"><i class="fas fa-circle-notch fa-spin"></i> DJPS AI is thinking...</div>

    <div class="input-area">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask anything or type 'Admission'..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // ==========================================
        // YAHAN APNI GROQ API KEY PASTE KARNA 👇
        // ==========================================
        const GROQ_API_KEY = "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"; 

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const loader = document.getElementById('typingLoader');

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") { sendMessage(); }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            userInput.value = '';

            // REDIRECT MAGIC
            const lowerText = text.toLowerCase();
            if (lowerText.includes('admission')) {
                setTimeout(() => {
                    addMessage("Redirecting you to the Admission page...", 'bot-msg');
                    setTimeout(() => window.location.href = "admission.html", 1000);
                }, 500);
                return;
            }

            loader.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

                        try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { 
                                role: "system", 
                                content: `You are the official AI Assistant of Divya Jyoti Public School (DJPS). You are integrated into the official website djps.in.
                                
NEVER say you don't have real-time info or that DJPS doesn't have a website. You know everything about DJPS.

Here is the DJPS Knowledge Base:
- School Name: Divya Jyoti Public School (DJPS)
- Website: djps.in
- Director's / Contact Number: +91 99354 56145
- Email: shashwat82@gmail.com
- Campus Address: FQ57+CGG, Kolhuwa, Beldand Road, Chandauli, UP 274001
- Admission: Admissions are currently open. Users can visit the 'Admission' page to apply.

Rules for answering:
1. If asked about the Director's number or contact, provide +91 9935456145 immediately.
2. If the user greets in Hindi (like "Jai Shree Ram" or "Namaste"), reply respectfully in the same tone.
3. Keep answers concise, helpful, and very friendly. Use Hindi/Hinglish if the user asks in Hindi.` 
                            },
                            { role: "user", content: text }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                const data = await response.json();
                loader.style.display = 'none';

                if(data.choices && data.choices.length > 0) {
                    addMessage(data.choices[0].message.content, 'bot-msg');
                } else {
                    addMessage("Oops! Network error.", 'bot-msg');
                }
            } catch (error) {
                loader.style.display = 'none';
                addMessage("Server connect nahi ho raha hai. Please try again.", 'bot-msg');
                console.error("Error:", error);
                        }
        
        }

        function addMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>

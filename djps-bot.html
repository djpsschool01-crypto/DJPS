<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJPS AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#050508;
    color:white;
    font-family:Poppins,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
}

/* HEADER */
nav{
    height:118px;
    flex-shrink:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 5%;

    background:#050508;
    border-bottom:1px solid rgba(212,175,55,.3);
}

.logo{
    font-family:'Playfair Display',serif;
    font-size:1.5rem;
    font-weight:800;
}

.logo span{
    display:block;
    color:#D4AF37;
    font-size:.6rem;
    letter-spacing:3px;
}

.back-btn{
    color:#D4AF37;
    text-decoration:none;
    border:1px solid #D4AF37;
    padding:9px 16px;
    border-radius:25px;
}

/* CHAT */
.chat-container{
    flex:1;
    overflow-y:auto;

    padding:30px 5%;

    display:flex;
    flex-direction:column;
    gap:15px;
}

.message{
    max-width:85%;

    padding:14px 18px;

    border-radius:15px;

    font-size:.95rem;
    line-height:1.55;

    white-space:pre-wrap;
    word-break:break-word;
}

.bot-msg{
    align-self:flex-start;

    background:rgba(212,175,55,.1);

    border:1px solid rgba(212,175,55,.35);

    border-bottom-left-radius:3px;
}

.user-msg{
    align-self:flex-end;

    background:linear-gradient(
        135deg,
        #D4AF37,
        #b59223
    );

    color:#000;

    font-weight:500;

    border-bottom-right-radius:3px;
}

/* LOADER */
.loader{
    display:none;

    padding:5px 5% 10px;

    color:#D4AF37;
    font-size:.85rem;

    flex-shrink:0;
}

/* INPUT */
.input-area{
    flex-shrink:0;

    padding:15px 5%;

    padding-bottom:
        calc(15px + env(safe-area-inset-bottom));

    background:#0a0a0f;

    border-top:1px solid rgba(212,175,55,.25);
}

.input-box{
    width:100%;
    max-width:850px;

    margin:auto;

    display:flex;
    align-items:center;

    gap:12px;
}

#userInput{
    flex:1;

    min-width:0;

    height:58px;

    padding:0 20px;

    border-radius:30px;

    border:1px solid rgba(212,175,55,.5);

    outline:none;

    background:#15151b;

    color:white;

    font-family:Poppins,sans-serif;

    font-size:1rem;
}

#userInput::placeholder{
    color:#aaa;
}

#userInput:focus{
    border-color:#D4AF37;
}

/* SEND */
.send-btn{
    width:58px;
    height:58px;

    min-width:58px;

    border:0;

    border-radius:50%;

    background:#D4AF37;

    color:#000;

    font-size:1.3rem;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.send-btn:active{
    transform:scale(.9);
}

.send-btn:disabled{
    opacity:.5;
}

/* MOBILE */
@media(max-width:500px){

    nav{
        height:118px;
    }

    .chat-container{
        padding:30px 5%;
    }

    .message{
        max-width:92%;
        font-size:.92rem;
    }

    #userInput{
        height:56px;
    }

    .send-btn{
        width:56px;
        height:56px;
        min-width:56px;
    }
}
</style>
</head>

<body>

<nav>

    <div class="logo">
        DJPS
        <span>AI Assistant</span>
    </div>

    <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Home
    </a>

</nav>


<div class="chat-container" id="chatBox">

    <div class="message bot-msg">
        Hello! Main DJPS ka smart AI assistant hoon.
    
    </div>

</div>


<div class="loader" id="loader">
    <i class="fas fa-circle-notch fa-spin"></i>
    DJPS AI is thinking...
</div>


<div class="input-area">

    <div class="input-box">

        <input
            id="userInput"
            type="text"
            placeholder="Ask anything or type 'Admission'..."
            autocomplete="off"
        >

        <button
            type="button"
            class="send-btn"
            onclick="sendMessage()"
        >
            <i class="fas fa-paper-plane"></i>
        </button>

    </div>

</div>


<script>

/* ==========================================
   IMPORTANT
   ==========================================

   Yahan NEW Groq API key lagao.

   Purani exposed key use mat karna.
*/

const GROQ_API_KEY = "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";


const chatBox =
    document.getElementById("chatBox");

const userInput =
    document.getElementById("userInput");

const loader =
    document.getElementById("loader");


/* ENTER KEY */

userInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        sendMessage();

    }

});


/* ==========================================
   SEND MESSAGE
   ========================================== */

async function sendMessage(){

    const text =
        userInput.value.trim();

    if(!text){
        return;
    }


    /* USER MESSAGE */

    addMessage(
        text,
        "user-msg"
    );

    userInput.value = "";


    /* ADMISSION */

    if(
        text.toLowerCase().includes("admission")
    ){

        addMessage(
            "Redirecting you to the Admission page...",
            "bot-msg"
        );

        setTimeout(function(){

            window.location.href =
                "admission.html";

        },1000);

        return;
    }


    /* LOADING */

    loader.style.display = "block";

    userInput.disabled = true;


    try{

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + GROQ_API_KEY
                },

                body:JSON.stringify({

                    model:
                        "llama-3.1-8b-instant",

                    messages:[

                        {
                            role:"system",

                            content:
                            "You are DJPS AI Assistant for Divya Jyoti Public School. Answer questions in a friendly, concise and helpful way. You can reply in Hindi, Hinglish or English depending on the user's language."
                        },

                        {
                            role:"user",
                            content:text
                        }

                    ],

                    temperature:.7,

                    max_tokens:500

                })
            }
        );


        const data =
            await response.json();


        console.log(
            "Groq response:",
            data
        );


        if(!response.ok){

            throw new Error(
                data?.error?.message ||
                "Groq API error"
            );

        }


        const reply =
            data?.choices?.[0]?.message?.content;


        if(reply){

            addMessage(
                reply,
                "bot-msg"
            );

        }else{

            addMessage(
                "AI ne response nahi diya.",
                "bot-msg"
            );

        }


    }catch(error){

        console.error(
            "AI ERROR:",
            error
        );

        addMessage(
            "AI connection error: " +
            error.message,
            "bot-msg"
        );

    }


    loader.style.display = "none";

    userInput.disabled = false;

    userInput.focus();

}


/* ==========================================
   ADD MESSAGE
   ========================================== */

function addMessage(text,className){

    const div =
        document.createElement("div");

    div.className =
        "message " + className;

    div.textContent = text;

    chatBox.appendChild(div);

    chatBox.scrollTop =
        chatBox.scrollHeight;

}

</script>

</body>
</html>

        /* ================= WEBSITE BASE THEME (Naya Navbar aur Dark Background) ================= */
        :root { --bg-dark: #050508; --neon-gold: #D4AF37; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }
        
        nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(5,5,8,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(212,175,55,0.2); z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: clamp(1.2rem, 4vw, 1.6rem); color: #fff; font-weight: 800; }
        .logo span { color: var(--neon-gold); font-family: 'Poppins', sans-serif; font-size: 0.6rem; display: block; letter-spacing: 3px; }
        .menu-btn { font-size: 1.8rem; color: var(--neon-gold); cursor: pointer; background: none; border: none; transition: 0.3s; }
        
        .sidebar { position: fixed; top: 0; right: -350px; width: 320px; height: 100vh; background: #0a0c10; border-left: 2px solid var(--neon-gold); transition: 0.4s ease; z-index: 2000; padding: 40px 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.8); }
        .sidebar.active { right: 0; }
        .close-btn { font-size: 2rem; color: #fff; cursor: pointer; float: right; margin-bottom: 30px; }
        .sidebar-links { display: flex; flex-direction: column; gap: 15px; clear: both; }
        .sidebar-links a { color: #fff; text-decoration: none; font-size: 1.1rem; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 15px; }
        .sidebar-links a:hover { color: var(--neon-gold); border-bottom-color: var(--neon-gold); padding-left: 10px; background: rgba(212,175,55,0.05); }

        .page-content { margin-top: 100px; padding-bottom: 50px; }

        /* ================= CLAUDE'S PYP CSS (Matched with Gold Theme) ================= */
        .pyp-section{
          --gold:#D4AF37; --bg:#050508; --card:#0a0c10; --line:rgba(212, 175, 55, 0.22);
          max-width:680px; margin:40px auto; padding:0 5%; color:#fff; font-family:'Poppins',sans-serif;
        }
        .pyp-header{text-align:center; margin-bottom:22px;}
        .pyp-eyebrow{font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); font-weight:500;}
        .pyp-title{font-family:'Playfair Display',serif; font-size:2.2rem; margin:8px 0 6px; color:#fff; font-weight:600;}
        .pyp-sub{font-size:13.5px; color:rgba(255,255,255,0.55); margin:0; font-weight:300;}

        .pyp-card{
          display:flex; align-items:center; gap:16px; padding:20px 18px; border-radius:14px;
          background:var(--card); border:1px solid var(--line);
          cursor:pointer; transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease;
          touch-action:manipulation; -webkit-tap-highlight-color:transparent;
        }
        .pyp-card:hover, .pyp-card:active{border-color:var(--gold); box-shadow:0 10px 25px rgba(212, 175, 55, 0.18); transform:translateY(-2px);}
        .pyp-card-icon{font-size:22px; color:var(--gold); width:44px; height:44px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:50%;}
        .pyp-card-text{flex:1; display:flex; flex-direction:column;}
        .pyp-card-text strong{font-size:15px; font-weight:500; color:#fff;}
        .pyp-card-text span{font-size:12.5px; color:rgba(255,255,255,0.5); font-weight:300;}
        .pyp-card-arrow{font-size:14px; color:var(--gold);}

        .pyp-overlay{
          position:fixed; inset:0; background:rgba(2,4,10,0.8); backdrop-filter:blur(4px);
          display:flex; align-items:flex-end; justify-content:center; z-index:9999;
          opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;
        }
        .pyp-overlay.active{opacity:1; visibility:visible;}
        .pyp-modal{
          width:100%; max-width:680px; max-height:82vh; overflow-y:auto;
          -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
          background:var(--bg); border:1px solid var(--line); border-top:1px solid var(--gold);
          border-radius:20px 20px 0 0; padding:24px 18px 34px; position:relative;
          box-shadow:0 -10px 40px rgba(0,0,0,0.6);
          transform:translateY(24px); transition:transform .3s cubic-bezier(.2,.8,.2,1);
        }
        .pyp-overlay.active .pyp-modal{transform:translateY(0);}
        .pyp-close{
          position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%;
          border:1px solid var(--line); background:transparent; color:var(--gold); font-size:14px; cursor:pointer;
          touch-action:manipulation; -webkit-tap-highlight-color:transparent;
        }
        .pyp-step h3{font-family:'Playfair Display',serif; font-size:1.3rem; margin:6px 0 18px; font-weight:600; color:#fff;}
        .pyp-class-choice{display:flex; gap:12px;}
        .pyp-class-btn{
          flex:1; padding:22px 10px; border-radius:14px; border:1px solid var(--line);
          background:var(--card); display:flex; flex-direction:column; align-items:center; gap:8px;
          cursor:pointer; font-weight:500; color:#fff; transition:border-color .25s ease, box-shadow .25s ease;
          touch-action:manipulation; -webkit-tap-highlight-color:transparent;
        }
        .pyp-class-btn:hover, .pyp-class-btn:active{border-color:var(--gold); box-shadow:0 8px 20px rgba(212, 175, 55, 0.18);}
        .pyp-class-num{font-family:'Playfair Display',serif; font-size:28px; color:var(--gold); font-weight:600;}
        .pyp-back{background:none; border:none; color:var(--gold); font-weight:500; font-size:13.5px; margin-bottom:14px; cursor:pointer; padding:0; display:flex; align-items:center; gap:8px;}

        .pyp-year-block{margin-bottom:10px; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:var(--card);}
        .pyp-year-head{
          display:flex; justify-content:space-between; align-items:center; padding:14px 16px;
          cursor:pointer; font-weight:500; font-size:14.5px; color:#fff;
          touch-action:manipulation; -webkit-tap-highlight-color:transparent;
        }
        .pyp-year-head .chev{transition:transform .25s ease; color:var(--gold); font-size:12px;}
        .pyp-year-block.open .chev{transform:rotate(90deg);}
        .pyp-subjects{max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.2,.8,.2,1);}
        .pyp-subjects-inner{display:flex; flex-direction:column; gap:6px; padding:2px 16px 16px;}
        .pyp-subj-btn{
          display:flex; justify-content:space-between; align-items:center;
          font-size:13.5px; font-weight:400; padding:10px 14px; border-radius:10px; text-decoration:none;
          background:rgba(212, 175, 55, 0.07); color:#fff; border:1px solid transparent; transition:background .2s ease, border-color .2s ease;
          touch-action:manipulation; -webkit-tap-highlight-color:transparent;
        }
        .pyp-subj-btn:hover, .pyp-subj-btn:active{background:rgba(212, 175, 55, 0.16); border-color:var(--line);}
        .pyp-subj-btn .view-tag{color:var(--gold); font-size:12px; font-weight:600; letter-spacing:.5px; display:flex; align-items:center; gap:5px;}
        .pyp-subj-btn.na{opacity:.35; pointer-events:none;}

          const overlay = document.getElementById('pypOverlay');
          const stepClass = document.getElementById('pypStepClass');
          const stepYears = document.getElementById('pypStepYears');
          const yearsList = document.getElementById('pypYearsList');
          const yearTitle = document.getElementById('pypYearTitle');

          document.getElementById('pypOpenBtn').addEventListener('click', function(){
            overlay.classList.add('active');
            stepClass.style.display = 'block';
            stepYears.style.display = 'none';
          });
          document.getElementById('pypClose').addEventListener('click', function(){
            overlay.classList.remove('active');
          });
          overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.classList.remove('active'); });

          document.getElementById('pypBack').addEventListener('click', function(){
            stepYears.style.display = 'none';
            stepClass.style.display = 'block';
          });
         document.querySelectorAll('.pyp-class-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              const cls = btn.getAttribute('data-class');
              renderYears(cls);
              stepClass.style.display = 'none';
              stepYears.style.display = 'block';
              yearTitle.textContent = 'Class ' + cls + ' — Select Year';
            });
          });

          function renderYears(cls){
            const years = Object.keys(PYP_DATA[cls]);
            yearsList.innerHTML = '';
            years.forEach(function(yr, idx){
              const block = document.createElement('div');
              block.className = 'pyp-year-block';
              const head = document.createElement('div');
              head.className = 'pyp-year-head';
              head.innerHTML = '<span>' + yr + '</span><span class="chev">›</span>';
              const subjWrap = document.createElement('div');
              subjWrap.className = 'pyp-subjects';
              const subjInner = document.createElement('div');
              subjInner.className = 'pyp-subjects-inner';

              PYP_DATA[cls][yr].forEach(function(item){
                const label = item[0], url = item[1], notAvailable = item[2];
                const a = document.createElement(notAvailable ? 'span' : 'a');
                a.className = 'pyp-subj-btn' + (notAvailable ? ' na' : '');
                a.innerHTML = '<span>' + label + '</span><span class="view-tag"><i class="fa-solid fa-eye"></i> View</span>';
                if(!notAvailable){ a.href = url; } 
                subjInner.appendChild(a);
              });

              subjWrap.appendChild(subjInner);
              head.addEventListener('click', function(){
                const isOpen = block.classList.contains('open');
                yearsList.querySelectorAll('.pyp-year-block.open').forEach(function(openBlock){
                  if(openBlock !== block){
                    openBlock.classList.remove('open');
                    openBlock.querySelector('.pyp-subjects').style.maxHeight = null;
                  }
              });
                if(isOpen){
                  block.classList.remove('open');
                  subjWrap.style.maxHeight = null;
                } else {
                  block.classList.add('open');
                  subjWrap.style.maxHeight = subjWrap.scrollHeight + 'px';
                }
              });
              block.appendChild(head);
              block.appendChild(subjWrap);
              yearsList.appendChild(block);
            });
          }
        })();

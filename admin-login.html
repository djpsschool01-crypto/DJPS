<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Divya Jyoti Public School</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

        header { background: linear-gradient(135deg, rgba(26, 26, 46, 1) 0%, rgba(22, 33, 62, 1) 100%); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #D4AF37; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo-section { display: flex; align-items: center; gap: 15px; }
        .school-logo { width: 50px; height: 50px; background: linear-gradient(135deg, #D4AF37 0%, #f0c94a 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #1a1a2e; }
        .school-info h1 { font-family: 'Playfair Display', serif; font-size: 20px; }
        .school-info p { font-size: 11px; color: #D4AF37; letter-spacing: 1px; text-transform: uppercase; }
        .back-btn { padding: 10px 20px; background: rgba(255,255,255,0.1); color: white; text-decoration: none; border-radius: 50px; border: 1px solid #D4AF37; font-size: 14px; transition: 0.3s; }
        .back-btn:hover { background: #D4AF37; color: #1a1a2e; }

        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5%; }
        .login-card { width: 100%; max-width: 400px; background: white; padding: 40px 35px; border-radius: 12px; border-left: 5px solid #D4AF37; box-shadow: 0 5px 25px rgba(0,0,0,0.08); animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .login-card .icon-badge { width: 64px; height: 64px; margin: 0 auto 18px; background: linear-gradient(135deg, #D4AF37 0%, #f0c94a 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #1a1a2e; }
        .login-card h2 { font-family: 'Playfair Display', serif; font-size: 22px; text-align: center; color: #1a1a2e; margin-bottom: 6px; }
        .login-card p.sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }

        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; color: #555; margin-bottom: 7px; font-weight: 500; }
        .field .input-wrap { position: relative; }
        .field input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; color: #222; font-size: 14px; outline: none; transition: 0.3s; font-family: 'Poppins', sans-serif; }
        .field input:focus { border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212,175,55,0.15); background: #fff; }
        .field .input-wrap input.pw-field { padding-right: 44px; }
        .eye-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #999; cursor: pointer; font-size: 16px; padding: 4px; }
        .eye-toggle:hover { color: #D4AF37; }

        .login-btn { width: 100%; padding: 13px; border: none; border-radius: 50px; background: linear-gradient(135deg, #D4AF37 0%, #f0c94a 100%); color: #1a1a2e; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,0.35); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        .msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 13px; display: none; align-items: center; gap: 8px; }
        .msg.error { background: #fdecea; color: #c0392b; }

        .note { margin-top: 20px; font-size: 11.5px; color: #999; text-align: center; line-height: 1.6; }
        footer { background: #16213e; color: white; text-align: center; padding: 20px; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <div class="logo-section">
        <div class="school-logo"><i class="fas fa-book-reader"></i></div>
        <div class="school-info">
            <h1>DIVYA JYOTI</h1>
            <p>Admin Panel</p>
        </div>
    </div>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
</header>

<div class="container">
    <div class="login-card">
        <div class="icon-badge"><i class="fas fa-user-shield"></i></div>
        <h2>Admin Login</h2>
        <p class="sub">Divya Jyoti Public School &mdash; Staff Access</p>

        <form id="adminLoginForm" autocomplete="off">
            <div class="field">
                <label for="adminId">Admin ID</label>
                <div class="input-wrap">
                    <input type="text" id="adminId" name="adminId" placeholder="Enter Admin ID" required>
                </div>
            </div>
            <div class="field">
                <label for="adminPassword">Password</label>
                <div class="input-wrap">
                    <input type="password" id="adminPassword" name="adminPassword" class="pw-field" placeholder="Enter Password" required>
                    <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Login</button>
            <div class="msg error" id="errorMsg"><i class="fas fa-circle-exclamation"></i> <span>Invalid Admin ID or Password.</span></div>
        </form>

        <p class="note">Login is verified securely by Firebase Authentication - your password is never stored in this page's code.</p>
    </div>
</div>

<footer>
    <p>© 2026 Divya Jyoti Public School | Admin Panel</p>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Same Firebase project used by updates.html
    const firebaseConfig = {
        apiKey: "AIzaSyDWixU7YycVXE7T6mo51Ym6OO_yMfZ8SM0",
        authDomain: "djps-website-3a826.firebaseapp.com",
        projectId: "djps-website-3a826"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Firebase Email/Password auth needs an email address. We let the
    // admin type a simple ID (like a phone number), and turn it into a
    // fixed-format email behind the scenes - see the setup note at the
    // bottom of this file for how to create that user in Firebase.
    const ID_DOMAIN = "djps-admin.local";

    // If already logged in, skip straight to the dashboard
    onAuthStateChanged(auth, (user) => {
        if (user) window.location.href = "admin-dashboard.html";
    });

    const form = document.getElementById('adminLoginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorMsg.style.display = 'none';

        const id = document.getElementById('adminId').value.trim();
        const password = document.getElementById('adminPassword').value;
        const email = id.includes('@') ? id : `${id}@${ID_DOMAIN}`;

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "admin-dashboard.html";
        } catch (err) {
            console.error(err);
            errorMsg.style.display = 'flex';
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Login';
        }
    });

    // Eye toggle
    const pwInput = document.getElementById('adminPassword');
    const eyeBtn = document.getElementById('eyeToggle');
    eyeBtn.addEventListener('click', function () {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        eyeBtn.innerHTML = isHidden ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        eyeBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
</script>

</body>
</html>

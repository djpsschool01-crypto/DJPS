<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Divya Jyoti Public School</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050508; --gold: #D4AF37; --gold-light: #f0c94a; --text-muted: #a0aabf; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(5,5,8,0.95); border-bottom: 1px solid rgba(212,175,55,0.2); position: fixed; width: 100%; z-index: 1000; backdrop-filter: blur(10px); }
        .logo-section { display: flex; align-items: center; gap: 14px; }
        .school-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #050508; flex-shrink: 0; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 800; line-height: 1.1; }
        .logo span { color: var(--gold); font-size: 0.65rem; display: block; letter-spacing: 3px; text-transform: uppercase; font-weight: 400; margin-top: 2px; }
        .back-btn, .logout-btn { color: var(--gold); text-decoration: none; font-weight: 500; transition: 0.3s; border: 1px solid var(--gold); padding: 8px 18px; border-radius: 50px; background: transparent; font-size: 0.85rem; cursor: pointer; font-family: 'Poppins', sans-serif; display: inline-flex; align-items: center; gap: 8px; }
        .back-btn:hover, .logout-btn:hover { background: var(--gold); color: #050508; }

        /* ===== LOGIN VIEW ===== */
        .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 20px 40px; }
        .login-card { width: 100%; max-width: 380px; background: linear-gradient(145deg, rgba(20,25,35,0.7), rgba(5,8,15,0.5)); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); border-top: 1px solid rgba(212,175,55,0.4); border-radius: 15px; padding: 36px 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); animation: fadeUp 0.5s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .login-card .icon { width: 60px; height: 60px; margin: 0 auto 18px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #050508; box-shadow: 0 8px 24px rgba(212,175,55,0.35); }
        .login-card h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; text-align: center; margin-bottom: 6px; }
        .login-card p.sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 26px; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12px; color: #ccc; margin-bottom: 7px; letter-spacing: 0.5px; }
        .field input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: #fff; font-size: 14px; font-family: 'Poppins', sans-serif; outline: none; transition: 0.3s; }
        .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }

        .pass-wrap { position: relative; }
        .pass-wrap input { padding-right: 44px; }
        .eye-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; padding: 6px; transition: color 0.25s; }
        .eye-toggle:hover { color: var(--gold); }

        .login-btn { width: 100%; padding: 13px; border: none; border-radius: 50px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #050508; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,0.35); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px; background: rgba(255,71,87,0.1); color: #ff6b7a; border: 1px solid rgba(255,71,87,0.25); display: none; text-align: center; }
        .error-msg.shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

        /* ===== DASHBOARD VIEW ===== */
        .dash-container { flex: 1; max-width: 900px; margin: 0 auto; padding: 110px 5% 60px; width: 100%; }
        .card { background: linear-gradient(145deg, rgba(20,25,35,0.7), rgba(5,8,15,0.5)); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); border-top: 1px solid rgba(212,175,55,0.35); border-radius: 15px; padding: 28px; box-shadow: 0 15px 30px rgba(0,0,0,0.4); margin-bottom: 25px; }
        .card h2 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 18px; font-size: 20px; display: flex; align-items: center; gap: 10px; }

        .card .field textarea { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: #fff; font-size: 14px; font-family: 'Poppins', sans-serif; outline: none; transition: 0.3s; resize: vertical; }
        .card .field textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }

        .post-btn { padding: 12px 28px; border: none; border-radius: 50px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #050508; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .post-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,0.35); }
        .post-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .status-msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
        .status-msg.success { background: rgba(46,204,113,0.12); color: #4ade80; border: 1px solid rgba(46,204,113,0.25); }
        .status-msg.error { background: rgba(255,71,87,0.1); color: #ff6b7a; border: 1px solid rgba(255,71,87,0.25); }

        .notice-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .notice-row:last-child { border-bottom: none; }
        .notice-row h4 { font-size: 15px; color: #fff; margin-bottom: 5px; }
        .notice-row p { font-size: 13px; color: var(--text-muted); }
        .delete-btn { background: none; border: 1px solid rgba(255,107,122,0.4); color: #ff6b7a; border-radius: 8px; padding: 7px 12px; font-size: 12px; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .delete-btn:hover { background: rgba(255,71,87,0.1); }

        .loader { text-align: center; padding: 20px; color: var(--gold); }
        .empty { text-align: center; padding: 20px; color: #666; font-size: 13px; }

        footer { text-align: center; padding: 20px; color: #666; font-size: 12px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-section">
            <div class="school-logo"><i class="fas fa-book-reader"></i></div>
            <div class="logo">DIVYA JYOTI <span id="navBadge">Public School</span></div>
        </div>
        <a href="index.html" class="back-btn" id="homeBtn"><i class="fas fa-arrow-left"></i> Home</a>
        <button class="logout-btn hidden" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</button>
    </nav>

    <!-- ===== LOGIN VIEW ===== -->
    <div class="login-wrap" id="loginView">
        <div class="login-card">
            <div class="icon"><i class="fas fa-user-shield"></i></div>
            <h1>Admin Login</h1>
            <p class="sub">Authorized access only</p>

            <form id="loginForm">
                <div class="field">
                    <label for="userId">Admin ID (Mobile Number)</label>
                    <input type="text" id="userId" placeholder="Enter Admin ID" required autocomplete="username">
                </div>
                <div class="field">
                    <label for="userPass">Password</label>
                    <div class="pass-wrap">
                        <input type="password" id="userPass" placeholder="Enter Password" required autocomplete="current-password">
                        <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Login</button>
                <div class="error-msg" id="errorMsg"><i class="fas fa-circle-exclamation"></i> Invalid credentials. Please try again.</div>
            </form>
        </div>
    </div>

    <!-- ===== DASHBOARD VIEW ===== -->
    <div class="dash-container hidden" id="dashboardView">
        <div class="card">
            <h2><i class="fas fa-bell"></i> Post a New Notice</h2>
            <form id="noticeForm">
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. Annual Sports Day - Registration Open" required>
                </div>
                <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" placeholder="Short details about this notice" required></textarea>
                </div>
                <div class="field">
                    <label for="link">Link (optional)</label>
                    <input type="url" id="link" placeholder="https://... (PDF, form, or page link)">
                </div>
                <button type="submit" class="post-btn" id="postBtn"><i class="fas fa-paper-plane"></i> Post Notice</button>
                <div class="status-msg success" id="successMsg"><i class="fas fa-circle-check"></i> Notice posted successfully.</div>
                <div class="status-msg error" id="errorMsgDash"><i class="fas fa-circle-exclamation"></i> Something went wrong. Please try again.</div>
            </form>
        </div>

        <div class="card">
            <h2><i class="fas fa-list"></i> Existing Notices</h2>
            <div id="noticesList">
                <div class="loader"><i class="fas fa-spinner fa-spin"></i> Loading notices...</div>
            </div>
        </div>
    </div>

    <footer>© 2026 Divya Jyoti Public School | Admin Panel</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDWixU7YycVXE7T6mo51Ym6OO_yMfZ8SM0",
            authDomain: "djps-website-3a826.firebaseapp.com",
            projectId: "djps-website-3a826"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const noticesCol = collection(db, "Notices");

        // ==========================================
        // Credentials are NOT stored in plain text.
        // We store a SHA-256 hash of "id:password" instead,
        // so viewing this file's source doesn't reveal them.
        // ==========================================
        const ADMIN_HASH = "61601bfa2cab1cbb4e3f88b95b9c3f0d910890ea2fbece35bd3a7c4541cd584d";

        async function sha256(text) {
            const data = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const homeBtn = document.getElementById('homeBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const navBadge = document.getElementById('navBadge');

        function showDashboard() {
            loginView.classList.add('hidden');
            dashboardView.classList.remove('hidden');
            homeBtn.classList.add('hidden');
            logoutBtn.classList.remove('hidden');
            navBadge.textContent = 'Main Admin';
            loadNotices();
        }

        function showLogin() {
            dashboardView.classList.add('hidden');
            loginView.classList.remove('hidden');
            logoutBtn.classList.add('hidden');
            homeBtn.classList.remove('hidden');
            navBadge.textContent = 'Public School';
        }

        // Restore session on load
        if (sessionStorage.getItem('adminAuth_djps') === 'true') {
            showDashboard();
        }

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('adminAuth_djps');
            showLogin();
        });

        // ---- Eye toggle for password field ----
        const eyeToggle = document.getElementById('eyeToggle');
        const passInput = document.getElementById('userPass');
        eyeToggle.addEventListener('click', () => {
            const isHidden = passInput.type === 'password';
            passInput.type = isHidden ? 'text' : 'password';
            eyeToggle.innerHTML = isHidden ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
            eyeToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        });

        // ---- Login form ----
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            errorMsg.classList.remove('shake');

            const id = document.getElementById('userId').value.trim();
            const pass = passInput.value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

            const enteredHash = await sha256(`${id}:${pass}`);

            setTimeout(() => {
                if (enteredHash === ADMIN_HASH) {
                    sessionStorage.setItem('adminAuth_djps', 'true');
                    loginForm.reset();
                    showDashboard();
                } else {
                    errorMsg.style.display = 'block';
                    void errorMsg.offsetWidth;
                    errorMsg.classList.add('shake');
                }
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Login';
            }, 400);
        });

        // ---- Notices: load / post / delete ----
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function loadNotices() {
            const listEl = document.getElementById('noticesList');
            listEl.innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin"></i> Loading notices...</div>';
            try {
                const q = query(noticesCol, orderBy("timestamp", "desc"));
                const snapshot = await getDocs(q);
                if (snapshot.empty) {
                    listEl.innerHTML = '<div class="empty">No notices posted yet.</div>';
                    return;
                }
                listEl.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const row = document.createElement('div');
                    row.className = 'notice-row';
                    row.innerHTML = `
                        <div>
                            <h4>${escapeHtml(data.title || '')}</h4>
                            <p>${escapeHtml(data.description || '')}</p>
                        </div>
                        <button class="delete-btn" data-id="${docSnap.id}"><i class="fas fa-trash"></i> Delete</button>
                    `;
                    listEl.appendChild(row);
                });

                listEl.querySelectorAll('.delete-btn').forEach((btn) => {
                    btn.addEventListener('click', async () => {
                        if (!confirm('Delete this notice?')) return;
                        await deleteDoc(doc(db, "Notices", btn.dataset.id));
                        loadNotices();
                    });
                });
            } catch (err) {
                console.error(err);
                listEl.innerHTML = '<div class="empty">Unable to load notices.</div>';
            }
        }

        const noticeForm = document.getElementById('noticeForm');
        const postBtn = document.getElementById('postBtn');
        const successMsg = document.getElementById('successMsg');
        const errorMsgDash = document.getElementById('errorMsgDash');

        noticeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            successMsg.style.display = 'none';
            errorMsgDash.style.display = 'none';
            postBtn.disabled = true;
            postBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting...';

            try {
                await addDoc(noticesCol, {
                    title: document.getElementById('title').value.trim(),
                    description: document.getElementById('description').value.trim(),
                    link: document.getElementById('link').value.trim() || null,
                    timestamp: serverTimestamp()
                });
                successMsg.style.display = 'block';
                noticeForm.reset();
                loadNotices();
            } catch (err) {
                console.error(err);
                errorMsgDash.style.display = 'block';
            } finally {
                postBtn.disabled = false;
                postBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Post Notice';
            }
        });
    </script>

</body>
</html>
